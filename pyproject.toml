[project]
name = "backend-ai-agent"
version = "0.1.0"
description = "DPYB AI Librarian & Personalization RAG Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "langgraph>=0.3.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "supabase>=2.13.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "pyzbar>=0.1.9",
    "pillow>=10.4.0",
    "python-multipart>=0.0.17",
    "langchain-openai>=1.6.2",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "greenlet>=3.5.5",
    "feedparser>=6.0.14",
    "opencv-python-headless>=5.0.0.93",
    "numpy>=2.5.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "pyzbar.*",
    "asyncpg.*",
    "feedparser.*",
]
ignore_missing_imports = true
ignore_errors = true
